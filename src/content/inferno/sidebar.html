<div id="set_timer">
  <div id="set_timer_time">3:30</div>
  <button id="set_timer_button">Start Set Timer</button>
</div>

<input id="waveinput" type="text" placeholder="#" style="width: 20%" />
<button id="playWaveNum" style="width: calc(80% - 5px); position: absolute">
  New Wave
</button>
<a id="replayLink">Replay Wave</a>
<button id="pauseResumeLink">Pause Wave</button>
<button id="toggleAutomation">Enable Automation</button>
<button id="togglePrayerOnly" type="button">Enable Prayer</button>

<div id="player_tile">Tile: -, -</div>
<div id="tile_grid_toggle">
  <input type="checkbox" id="showTileGrid" />
  <label for="showTileGrid">Show tile grid</label>
  <span id="tile_grid_count"></span>
</div>
<button id="toggleDebugPanel" type="button">Debug Panel</button>
<button id="dumpScores" type="button">Dump Scores</button>
<button id="customScenario" type="button">CUSTOM wave</button>
<button id="customScenario2" type="button">CUSTOM wave 2</button>
<button id="customScenario3" type="button">CUSTOM wave 3</button>
<button id="customScenario4" type="button">CUSTOM wave 4</button>
<button id="customScenario5" type="button">CUSTOM wave 5</button>
<div id="block_mouse_toggle">
  <input type="checkbox" id="blockMouseInput" checked />
  <label for="blockMouseInput">Block mouse input</label>
</div>
<div id="automation_log_section">
  <div id="automation_log_header">
    Automation log
    <button id="copyAutomationLog" type="button">Copy</button>
  </div>
  <pre id="automation_log"></pre>
</div>

<select name="loadouts" id="loadouts">
  <option value="max_tbow_speed">Max Tbow + Chins</option>
  <option value="max_tbow">Max Tbow</option>
  <option value="max_fbow">Max Fbow</option>
  <option value="budget_fbow">Budget Fbow</option>
  <option value="rcb">RCB</option>
  <option value="zerker">Zerker</option>
  <option value="pure">Pure</option>
  <option value="max_melee">Max Melee (WIP)</option>
</select>

<select name="shieldDirection" id="shieldDirection" style="display: none;">
  <option value="random">Random Shield Direction</option>
  <option value="west">West Zuk Shield</option>
  <option value="east">East Zuk Shield</option>
</select>

<div style="
      width: 100%;
      text-align: center;
      padding-top: 10px;
      padding-bottom: 10px;
      display: none;
      ">
  <input type="checkbox" id="onTask" name="onTask" />
  <label for="onTask">On Task?</label>
</div>
<div id="pillars" style="display: none;">
  <label>Pillars</label>
  <input type="checkbox" id="southPillar" name="southPillar" checked />
  <label for="southPillar">S</label>
  <input type="checkbox" id="westPillar" name="westPillar" checked />
  <label for="westPillar">W</label>
  <input type="checkbox" id="northPillar" name="northPillar" checked />
  <label for="northPillar">N</label>
</div>

<div style="
    width: 100%;
    text-align: center;
    padding-top: 10px;
    padding-bottom: 10px;
  ">
  <input type="checkbox" id="waveProgression" name="waveProgression" checked />
  <label for="waveProgression">Wave Progression</label>
</div>

<div style="
    width: 100%;
    text-align: center;
    padding-top: 10px;
    padding-bottom: 10px;
    display: none;
  ">
  <input type="checkbox" id="spawnIndicators" name="spawnIndicators">
  <label for="spawnIndicators">Spawn Indicators</label>
</div>

<div style="
    width: 100%;
    text-align: center;
    padding-top: 10px;
    padding-bottom: 10px;
    display: none;
  ">
  <input type="checkbox" id="displaySetTimer" name="displaySetTimer">
  <label for="displaySetTimer">Display Set Timer Below Zuk</label>
</div>

<a href="/?wave=0" style="display: none;">Custom Mob Mode</a>
<button id="exportCustomWave" style="display: none;">Play/Export Wave</button>
<button id="editWave" style="display: none;">Edit Wave</button>
